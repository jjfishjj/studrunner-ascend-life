<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b2a5b" />
    <title>揚升人生：五階自然學習闖關</title>
    <meta name="description" content="《揚升人生》是五階 3D 樂高風格學習闖關：走進森林源頭、夕照海灣、五運河谷、星瀑觀象台與海灘／叢林／瀑布合一迷宮，收集 20 張地標筆記磚。" />
    <meta name="keywords" content="揚升人生,五階學習,樂高闖關,3D平台遊戲,森林,海灘,瀑布,叢林,學習筆記" />
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0b2a5b; color: #fff; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
      #boot img { width: 96px; height: 96px; }
      #boot .bar { width: min(260px, 70vw); height: 12px; border-radius: 8px; background: rgba(255,255,255,.18); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 8px; background: #f2cd37; animation: bootbar 1.1s ease-in-out infinite; }
      #boot p { margin: 0; font-weight: 800; letter-spacing: .12em; font-size: 14px; opacity: .85; }
      #boot .boot-title { font-size: 22px; letter-spacing: .16em; font-weight: 1000; color: #f2cd37; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
      #boot button { display: none; padding: 10px 22px; border: 0; border-radius: 10px; background: #f2cd37; color: #1b2a34; font-weight: 900; font-size: 16px; cursor: pointer; }
      #boot.failed .bar { display: none; }
      #boot.failed button { display: inline-block; }
      @keyframes bootbar { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="./loader-icon.png" alt="" />
        <div class="bar"><i></i></div>
        <p class="boot-title">揚升人生</p>
        <p id="boot-text">正在搭積木⋯</p>
        <button onclick="location.reload()">重新載入</button>
      </div>
    </div>
    <script>
      window.addEventListener('error', function () {
        var b = document.getElementById('boot');
        if (b) { b.className = 'failed'; document.getElementById('boot-text').textContent = '載入失敗，請重試'; }
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
